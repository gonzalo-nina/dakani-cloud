spring.application.name=ropa
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/tiendaropadk}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:20052022}

# Configuracion de JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
# Evita lazy loads extra durante serialización JSON (Fase rendimiento)
spring.jpa.open-in-view=false   
# Dev: SPRING_JPA_GENERATE_STATS=true y LOG_HIBERNATE_STAT=DEBUG para auditar N+1
spring.jpa.properties.hibernate.generate_statistics=${SPRING_JPA_GENERATE_STATS:false}
logging.level.org.hibernate.stat=${LOG_HIBERNATE_STAT:WARN}
# Umbral (ms) para log de peticiones lentas en SlowRequestLoggingFilter
app.performance.slow-request-ms=1000

# Flyway
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
# El repair() automatico se ejecuta vía FlywayConfig.repairAndMigrateStrategy.
# Permite aplicar V0 en equipos que ya tenían V1+ sin V0 (V0 es idempotente con IF NOT EXISTS).
spring.flyway.out-of-order=true

security.jwt.key=${SECURITY_JWT_KEY:07e919ee49af082a1c9e8051331d55ae5a1d7ff8c8c7a568149f9f4dbefd89cd}
security.jwt.user.generator=${SECURITY_JWT_USER_GENERATOR:appRopaGrupoBtfld5}

# Orígenes CORS permitidos (separados por coma; acepta patrones como *)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:3000,http://localhost:1420,http://localhost:4173}

# Reservas blandas: solicitudes VENTA PENDIENTE sin atender (0 = desactivar expiración automática)
solicitud.reserva.ttl-minutos=90
solicitud.reserva.expiracion-intervalo-ms=300000

# Venta directa: permite descontar stock directo desde almacen si el piso no tiene stock
venta.directa.habilitada=false

# Habilitación del módulo de IA y predicción (deshabilitado temporalmente)
dakani.ia.habilitada=false

# Microservicio de predicción IA local
ai.prediction.base-url=http://localhost:8000

# MLOps Pipeline Configuration
dakani.mlops.csv-path=${user.dir}/../dakani/api_ia/ventas_crudas.csv
dakani.mlops.fastapi-url=http://localhost:8000/entrenar_modelo
